name: Period Reminder Daily Check

on:
  schedule:
    # 每天北京时间早上 08:00 自动触发运行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 手动点击测试

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行提醒脚本
      env:
        QYWX_ROBOT_URL: ${{ secrets.QYWX_ROBOT_URL }}
        JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
        JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
      run: python main.py
