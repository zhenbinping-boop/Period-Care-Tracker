name: Period Reminder Daily Check

on:
  schedule:
    # ⏱️ 每天北京时间上午 10:00 自动触发（对应 UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 保留手动触发测试按钮

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行提醒脚本
      env:
        QYWX_ROBOT_URL: ${{ secrets.QYWX_ROBOT_URL }}
        JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
        JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
      run: python main.py
